# Infra local da POC. Porta externa 5466 para não conflitar com outros Postgres locais.
name: mastra-agent-poc

services:
  postgres:
    image: postgres:17-alpine
    container_name: mastra-agent-poc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
    ports:
      - '5466:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
